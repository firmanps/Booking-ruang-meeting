name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versi pnpm harus sesuai dengan packageManager di package.json
  PNPM_VERSION: "10.26.2"
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Install deps + Lint + Build (Turbo)
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Lint & Build (Turbo)
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm lint
        continue-on-error: true  # Tidak gagalkan CI jika ada lint warning

      - name: 🏗️ Build semua packages (Turbo)
        run: pnpm build
        env:
          # Dummy value agar Next.js tidak error saat build tanpa API nyata
          NEXT_PUBLIC_API_URL: http://localhost:5000

  # ─────────────────────────────────────────────
  # JOB 2: Docker Build — API (khusus branch main)
  # ─────────────────────────────────────────────
  docker-api:
    name: 🐳 Docker Build — API
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Docker image (api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: booking-ruang-meeting-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ─────────────────────────────────────────────
  # JOB 3: Docker Build — Web (khusus branch main)
  # ─────────────────────────────────────────────
  docker-web:
    name: 🐳 Docker Build — Web
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Docker image (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: booking-ruang-meeting-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ─────────────────────────────────────────────
  # JOB 4: Ringkasan CI (opsional gate)
  # ─────────────────────────────────────────────
  ci-success:
    name: ✅ CI Passed
    runs-on: ubuntu-latest
    needs: [build, docker-api, docker-web]
    if: always()
    steps:
      - name: Cek status semua job
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Job 'build' gagal"
            exit 1
          fi
          if [[ "${{ needs.docker-api.result }}" != "success" && "${{ needs.docker-api.result }}" != "skipped" ]]; then
            echo "❌ Job 'docker-api' gagal"
            exit 1
          fi
          if [[ "${{ needs.docker-web.result }}" != "success" && "${{ needs.docker-web.result }}" != "skipped" ]]; then
            echo "❌ Job 'docker-web' gagal"
            exit 1
          fi
          echo "✅ Semua job CI berhasil!"

